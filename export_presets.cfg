; Presets de exportacao Windows (E7.1). Dois presets com custom features que escolhem a cena inicial (project.godot,
; application/run/main_scene.<feature>): cliente e servidor dedicado. Reprodutivel via tools/build_windows.py (docs/BUILD.md).
; Sem assinatura de codigo, sem icone (placeholder), sem segredos. NAO altere os nomes dos presets sem ajustar o script.
; E8.1: o SERVIDOR exclui assets/* (arte e so do cliente; nenhum script do servidor carrega assets). O CLIENTE empacota assets/ASSET_MANIFEST.json
; e exclui os pacotes ainda nao usados (docs/E8_MODELS.md, secao Build): ao usar um pacote novo, tire-o da lista de exclusao.

[preset.0]

name="Windows Client"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="eldervale_client"
export_filter="all_resources"
include_filter="build_info.json, data/*, shared/*, assets/ASSET_MANIFEST.json"
exclude_filter="tests/*, tools/*, docs/*, backend/*, build/*, .tools/*, .git/*, *.md, *.py, *.mjs, *.mts, *.sh, assets/third_party/kaykit_medieval_hexagon/*, assets/third_party/quaternius_medieval_buildings/*, assets/third_party/quaternius_rts/*, assets/third_party/quaternius_modular_dungeon/*, assets/third_party/quaternius_knight/*, assets/third_party/kenney_mini_arena/*, assets/third_party/kenney_starter_kits/*, assets/third_party/oculus_audio_pack/*, assets/third_party/game_icons/*, assets/third_party/google_fonts/*, assets/third_party/quaternius_animals/Stag*, assets/third_party/quaternius_animals/Husky*, assets/third_party/quaternius_easy_enemies/Frog*, assets/third_party/quaternius_easy_enemies/Rat*, assets/third_party/quaternius_easy_enemies/Snake*, assets/third_party/quaternius_easy_enemies/Wasp*"
export_path="build/windows/client/Eldervale.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.7.0.1"
application/product_version="0.7.0.1"
application/company_name="Eldervale (alpha)"
application/product_name="Eldervale Client"
application/file_description="Eldervale alpha fechada (placeholder, sem assinatura)"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

